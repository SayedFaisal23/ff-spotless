services:
  app:
    build:
      target: development
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    command: >
      sh -c "if [ ! -f vendor/.ffspotless-composer-lock ] || ! cmp -s composer.lock vendor/.ffspotless-composer-lock; then composer install --no-interaction --no-progress && cp composer.lock vendor/.ffspotless-composer-lock; fi; php artisan optimize:clear; exec apache2-foreground"

  vite:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: "5173"
    volumes:
      - .:/app
      - vite_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: >
      sh -c "if [ ! -f node_modules/.ffspotless-package-lock ] || ! cmp -s package-lock.json node_modules/.ffspotless-package-lock; then npm ci --ignore-scripts --no-audit --no-fund && cp package-lock.json node_modules/.ffspotless-package-lock; fi; npm run dev"
    restart: unless-stopped

volumes:
  app_vendor:
  vite_node_modules:
